# Guitar tunings. Each is a list of MIDI pitches, one per string, ordered
# HIGH to LOW (index 0 = high E), matching Score.tuning and TabNote.string
# (0 = high E). Standard reference:
#   high E4 = 64, B3 = 59, G3 = 55, D3 = 50, A2 = 45, low E2 = 40
tunings:
  standard: [64, 59, 55, 50, 45, 40]
  drop_d: [64, 59, 55, 50, 45, 38]          # low E -> D
  half_step_down: [63, 58, 54, 49, 44, 39]  # Eb standard
  open_g: [62, 59, 55, 50, 43, 38]          # D B G D G D
  open_d: [62, 57, 54, 50, 45, 38]          # D A F# D A D
